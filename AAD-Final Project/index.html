<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hierly | Freelance services</title>
    <link rel="icon" href="assets/Favicons/favicon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- STYLE SHEETS -->
    <link rel="stylesheet" href="css/MainPage.css">
</head>
<body>

<!--  NAVIGATION BAR  -->
<header id="navigationBar">
    <nav class="navbar navbar-expand-lg bg-body-tertiary p-3">
        <div class="container-fluid">
            <!-- Logo -->
            <img src="assets/Logos/logo.png" width="120px" alt="Hierly Logo">

            <!-- Search Bar -->
            <div class="d-flex ms-auto me-4">
                <input class="form-control me-2" id="textSearch" type="search" placeholder="Search">
                <button class="btn btn-success" type="submit">
                    <i class="fas fa-search" style="color: white"></i>
                </button>
            </div>

            <!-- Icons & Links -->
            <ul class="navbar-nav d-flex flex-row align-items-center gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-bell fa-lg" title="Notifications"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-envelope fa-lg" title="Messages"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-list fa-lg" title="List"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="#">Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link p-0" href="#">
                        <img src="assets/Users/user.jpeg" alt="Profile" class="rounded-circle" width="35" height="35">
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<main>
    <div id="heroSection">

    </div>
</main>
</body>
</html>
